38, "lon": 42.7067, "time": "2026-09-15 09:51:54", "date": "15-09-2026", "hijri": "4 ربيع الآخر 1448هـ", "place": "منطقة ريفية بمحافظة رنية"}];const map=L.map('map');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const line=points.map(p=>[p.lat,p.lon]);L.polyline(line,{color:'#1971c2',weight:4,opacity:.75}).addTo(map);const markers=[];function content(p){return `<div class="leaflet-popup-content"><b>النقطة رقم ${p.n}</b><br><b>الموقع:</b> ${p.place}<br><b>الوقت:</b> ${p.time.slice(11)}<br><b>التاريخ الميلادي:</b> ${p.date}<br><b>التاريخ الهجري:</b> ${p.hijri}<br><b>الإحداثيات:</b> ${p.lat}, ${p.lon}<br><a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}">فتح التنقل</a></div>`}function select(i){document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));const el=document.querySelector('.item[data-i="'+i+'"]');if(el){el.classList.add('active');el.scrollIntoView({block:'nearest'})};map.setView([points[i].lat,points[i].lon],15);markers[i].openPopup()}points.forEach((p,i)=>{const m=L.marker([p.lat,p.lon]).addTo(map).bindPopup(content(p));m.bindTooltip('النقطة '+p.n+' — '+p.time.slice(11));m.on('click',()=>{const el=document.querySelector('.item[data-i="'+i+'"]');if(el){document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));el.classList.add('active')}});markers.push(m);const d=document.createElement('div');d.className='item';d.dataset.i=i;d.innerHTML='<span class="num">'+p.n+'</span><b>'+p.time.slice(0,10)+' '+p.time.slice(11)+'</b><br>'+p.hijri+' — '+p.place+'<br>'+p.lat+', '+p.lon;d.onclick=()=>select(i);document.getElementById('list').appendChild(d)});map.fitBounds(L.latLngBounds(line),{padding:[25,25]});document.getElementById('toggle').onclick=()=>document.getElementById('panel').classList.toggle('hidden');const legend=L.control({position:'bottomleft'});legend.onAdd=()=>{let d=L.DomUtil.create('div','legend');d.innerHTML='اضغط على نقطة أو اخترها من القائمة';return d};legend.addTo(map);</script></body></html>
